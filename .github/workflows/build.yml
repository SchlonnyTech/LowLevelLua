name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libllvm18 llvm-18 \
            clang-18 cmake ninja-build build-essential \
            libtcc-dev zip

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build -j

      - name: Smoke test
        run: |
          ./build/lllc --version
          ./build/lllc --version | grep -q "LLL Compiler version"

      - name: Stage
        run: |
          mkdir -p dist
          cp build/lllc dist/lllc-linux-x86_64
          strip dist/lllc-linux-x86_64 || true
          ls -la dist/

      - name: Zip
        run: |
          cd dist
          zip -r ../lllc-linux-x86_64.zip .
          cd ..
          ls -la lllc-linux-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lllc-linux-x86_64
          path: lllc-linux-x86_64.zip
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-libffi
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
            zip

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Smoke test
        run: |
          ./build/lllc.exe --version
          ./build/lllc.exe --version | grep -q "LLL Compiler version"

      - name: Collect dependencies
        run: |
          mkdir -p dist
          cp build/lllc.exe dist/lllc-windows-x86_64.exe

          REQUIRED="
            libLLVM-22.dll
            libffi-8.dll
            libxml2-16.dll
            zlib1.dll
            libzstd.dll
            libstdc++-6.dll
            libgcc_s_seh-1.dll
            libwinpthread-1.dll
          "

          missing=0
          for name in $REQUIRED; do
            path=$(find /ucrt64/bin -maxdepth 1 -iname "$name" | head -1)
            if [ -n "$path" ]; then
              cp "$path" dist/
              echo "ok      $name"
            else
              echo "MISSING $name"
              missing=1
            fi
          done

          if [ $missing -ne 0 ]; then
            echo
            echo "Available DLLs matching patterns:"
            ls /ucrt64/bin | grep -iE 'llvm|ffi|xml|zlib|zstd|stdc|gcc|pthread' | sort
            exit 1
          fi

          echo
          echo "--- dist ---"
          ls -la dist/

      - name: Verify all DLLs are present
        run: |
          for name in libLLVM-22.dll libffi-8.dll libxml2-16.dll zlib1.dll libzstd.dll libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll lllc-windows-x86_64.exe; do
            if [ ! -f "dist/$name" ]; then
              echo "FAIL: dist/$name missing"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Zip
        run: |
          cd dist
          zip -r ../lllc-windows-x86_64.zip .
          cd ..
          ls -la lllc-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lllc-windows-x86_64
          path: lllc-windows-x86_64.zip
          if-no-files-found: error

  verify-windows-artifact:
    name: Verify Windows artifact
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lllc-windows-x86_64
          path: artifact

      - name: Extract
        shell: pwsh
        run: |
          Expand-Archive -Path artifact\lllc-windows-x86_64.zip -DestinationPath extracted
          Get-ChildItem extracted | Format-Table Name, Length

      - name: Run on Windows
        shell: pwsh
        run: |
          $env:PATH = "$pwd\extracted;$env:PATH"
          $out = & .\extracted\lllc-windows-x86_64.exe --version 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "Exit code $LASTEXITCODE" }
          if ($out -notmatch "LLL Compiler version") { throw "Unexpected output" }
          Write-Host "Windows artifact verified."

  bump:
    name: Auto-tag and release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [linux, windows, verify-windows-artifact]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: ver
        run: |
          MAJOR=$(grep -E '^#define LLL_VERSION_MAJOR' include/lll.h | awk '{print $3}')
          MINOR=$(grep -E '^#define LLL_VERSION_MINOR' include/lll.h | awk '{print $3}')
          PATCH=$(grep -E '^#define LLL_VERSION_PATCH' include/lll.h | awk '{print $3}')
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "current=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Bump if needed
        id: tag
        run: |
          TAG="${{ steps.ver.outputs.current }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            P=$(( ${{ steps.ver.outputs.patch }} + 1 ))
            NEW="v${{ steps.ver.outputs.major }}.${{ steps.ver.outputs.minor }}.$P"
            sed -i "s/^#define LLL_VERSION_PATCH .*/#define LLL_VERSION_PATCH $P/" include/lll.h
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add include/lll.h
            git commit -m "chore: bump version to $NEW [skip ci]"
            git push
            echo "tag=$NEW" >> $GITHUB_OUTPUT
          else
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "Created tag $TAG"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Verify artifacts present
        run: |
          if [ ! -f "artifacts/lllc-linux-x86_64/lllc-linux-x86_64.zip" ]; then
            echo "FAIL: linux zip missing"
            exit 1
          fi
          if [ ! -f "artifacts/lllc-windows-x86_64/lllc-windows-x86_64.zip" ]; then
            echo "FAIL: windows zip missing"
            exit 1
          fi
          echo "Both zips present."

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/lllc-linux-x86_64/lllc-linux-x86_64.zip
            artifacts/lllc-windows-x86_64/lllc-windows-x86_64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
